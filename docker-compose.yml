version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: recipe_postgres

    restart: always

    env_file:
      - .env

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4

    container_name: recipe_pgadmin

    restart: always

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin123

    ports:
      - "5050:80"

    depends_on:
      - postgres

  chromadb:
    image: chromadb/chroma

    container_name: recipe_chromadb

    restart: always

    ports:
      - "8001:8000"

    volumes:
      - chroma_data:/chroma/chroma

volumes:

  postgres_data:

  chroma_data: